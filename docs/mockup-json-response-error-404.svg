<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 840" width="100%" height="100%">
  <defs>
    <style>
      .canvas-bg { fill: #f8fafc; }
      .window-bg { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.5; rx: 12px; }
      .window-header { fill: #f1f5f9; stroke: #cbd5e1; stroke-width: 1; }
      .tab-bar { fill: #ffffff; stroke: #e2e8f0; stroke-width: 1; }
      .code-area { fill: #ffffff; stroke: #e2e8f0; stroke-width: 1; }
      .line-num-bg { fill: #f8fafc; stroke: #e2e8f0; stroke-width: 0.8; }
      
      /* Typography */
      .font-title { font-family: 'Segoe UI', Arial, sans-serif; font-size: 16px; font-weight: bold; fill: #0f172a; }
      .font-sub { font-family: 'Segoe UI', Arial, sans-serif; font-size: 10px; fill: #64748b; }
      .font-url { font-family: 'Consolas', 'Courier New', monospace; font-size: 11px; fill: #1e293b; font-weight: bold; }
      .font-line-num { font-family: 'Consolas', monospace; font-size: 9.5px; fill: #94a3b8; text-anchor: end; }
      
      /* JSON Code Highlighting */
      .json-text { font-family: 'Consolas', 'Courier New', monospace; font-size: 11px; }
      .j-brace { fill: #334155; font-weight: bold; }
      .j-key { fill: #0369a1; font-weight: bold; }      /* Blue for Keys */
      .j-str { fill: #dc2626; }                         /* Red for Error Strings */
      .j-str-safe { fill: #15803d; }
      .j-num { fill: #dc2626; font-weight: bold; }      /* Red for Error Numbers */
      .j-null { fill: #94a3b8; font-weight: bold; font-style: italic; } /* Muted null */
      .j-colon { fill: #64748b; }
      
      /* Right Explanation Panel */
      .panel-card { fill: #f8fafc; stroke: #e2e8f0; stroke-width: 1; rx: 8px; }
      .panel-header { font-family: 'Segoe UI', Arial, sans-serif; font-size: 11px; font-weight: bold; fill: #0f172a; }
      .panel-text { font-family: 'Segoe UI', Arial, sans-serif; font-size: 9px; fill: #475569; line-height: 1.4; }
      .panel-tag { font-family: 'Consolas', monospace; font-size: 8.5px; fill: #dc2626; }
      
      /* Badges */
      .badge-get { fill: #eff6ff; stroke: #3b82f6; stroke-width: 1; rx: 4px; }
      .badge-get-text { font-family: 'Consolas', monospace; font-size: 10px; font-weight: bold; fill: #1d4ed8; text-anchor: middle; }
      .badge-status-error { fill: #fef2f2; stroke: #ef4444; stroke-width: 1; rx: 12px; }
      .badge-status-error-text { font-family: 'Segoe UI', Arial, sans-serif; font-size: 10px; font-weight: bold; fill: #b91c1c; text-anchor: middle; }
      .badge-meta { fill: #f1f5f9; stroke: #cbd5e1; stroke-width: 0.8; rx: 4px; }
      .badge-meta-text { font-family: 'Consolas', monospace; font-size: 9px; fill: #475569; text-anchor: middle; }
    </style>
  </defs>

  <!-- Canvas Background -->
  <rect width="1060" height="840" class="canvas-bg" />

  <!-- Main Window Card -->
  <g id="Api-Mockup-Window" transform="translate(30, 25)">
    <!-- Window Outer Shell -->
    <rect x="0" y="0" width="1000" height="790" rx="14" class="window-bg" filter="drop-shadow(0 12px 24px rgba(15,23,42,0.08))" />
    
    <!-- Window Header / Title Bar -->
    <path d="M 0,14 Q 0,0 14,0 L 986,0 Q 1000,0 1000,14 L 1000,52 L 0,52 Z" class="window-header" />
    
    <!-- Window Control Buttons (macOS Dots) -->
    <circle cx="24" cy="26" r="6" fill="#ef4444" stroke="#dc2626" stroke-width="0.5" />
    <circle cx="44" cy="26" r="6" fill="#f59e0b" stroke="#d97706" stroke-width="0.5" />
    <circle cx="64" cy="26" r="6" fill="#10b981" stroke="#059669" stroke-width="0.5" />

    <!-- Application / Brand Title in Header -->
    <text x="90" y="31" class="font-title">Herbapedia REST API &mdash; Respon Penanganan Galat (404 Not Found)</text>
    <text x="640" y="31" class="font-sub">SOAL 12 POINT E &bull; GET /api/produk.php?id=9999</text>

    <!-- Request URL & Action Bar -->
    <g id="URL-Bar" transform="translate(18, 62)">
      <!-- URL Bar Container -->
      <rect x="0" y="0" width="964" height="42" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1" />
      
      <!-- HTTP Method Badge (GET) -->
      <rect x="10" y="8" width="50" height="26" class="badge-get" />
      <text x="35" y="25" class="badge-get-text">GET</text>

      <!-- URL Input Box -->
      <text x="70" y="26" class="font-url">http://localhost/MARKETPLACE/WEB%20SERVICE%20MARKETPLACE/api/produk.php?id=9999</text>

      <!-- Status Code Badge (404 Not Found) -->
      <g transform="translate(670, 8)">
        <rect x="0" y="0" width="125" height="26" class="badge-status-error" />
        <circle cx="14" cy="13" r="4" fill="#ef4444" />
        <text x="70" y="17" class="badge-status-error-text">404 Not Found</text>
      </g>

      <!-- Response Time Badge -->
      <g transform="translate(803, 8)">
        <rect x="0" y="0" width="70" height="26" class="badge-meta" />
        <text x="35" y="17" class="badge-meta-text">12 ms</text>
      </g>

      <!-- Response Size Badge -->
      <g transform="translate(881, 8)">
        <rect x="0" y="0" width="73" height="26" class="badge-meta" />
        <text x="36" y="17" class="badge-meta-text">240 B</text>
      </g>
    </g>

    <!-- Tab Strip (Response Preview Header) -->
    <g id="Tab-Strip" transform="translate(18, 114)">
      <rect x="0" y="0" width="964" height="32" class="tab-bar" />
      <!-- Active Tab -->
      <rect x="0" y="0" width="130" height="32" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" />
      <line x1="0" y1="0" x2="130" y2="0" stroke="#ef4444" stroke-width="3" />
      <text x="65" y="20" font-family="'Segoe UI', Arial, sans-serif" font-size="11px" font-weight="bold" fill="#0f172a" text-anchor="middle">Body (JSON)</text>
      
      <!-- Inactive Tabs -->
      <text x="180" y="20" font-family="'Segoe UI', Arial, sans-serif" font-size="11px" fill="#64748b" text-anchor="middle">Headers (8)</text>
      <text x="260" y="20" font-family="'Segoe UI', Arial, sans-serif" font-size="11px" fill="#64748b" text-anchor="middle">Cookies (0)</text>
      
      <!-- Content Type indicator -->
      <text x="950" y="20" font-family="'Consolas', monospace" font-size="10px" fill="#64748b" text-anchor="end">application/json; charset=UTF-8</text>
    </g>

    <!-- Two-Column Workspace: Code View (Left 650px) + Anatomy Panel (Right 296px) -->
    <g id="Workspace-Body" transform="translate(18, 146)">
      
      <!-- LEFT: JSON Code Area Container -->
      <rect x="0" y="0" width="650" height="625" class="code-area" />
      
      <!-- Line Number Column Background -->
      <rect x="0" y="0" width="38" height="625" class="line-num-bg" />
      <line x1="38" y1="0" x2="38" y2="625" stroke="#e2e8f0" stroke-width="1" />

      <!-- Line Numbers (1 to 14) -->
      <g id="Line-Numbers" class="font-line-num">
        <text x="30" y="28">1</text><text x="30" y="52">2</text><text x="30" y="76">3</text>
        <text x="30" y="100">4</text><text x="30" y="124">5</text><text x="30" y="148">6</text>
        <text x="30" y="172">7</text><text x="30" y="196">8</text>
      </g>

      <!-- JSON Syntax Highlighting Content -->
      <g id="JSON-Content" class="json-text" transform="translate(48, 6)">
        <!-- Line 1 -->
        <text x="0" y="22" class="j-brace">{</text>
        
        <!-- Line 2: status error -->
        <text x="20" y="46">
          <tspan class="j-key">"status"</tspan><tspan class="j-colon">: </tspan><tspan class="j-str">"error"</tspan><tspan class="j-colon">,</tspan>
        </text>

        <!-- Line 3: code 404 -->
        <text x="20" y="70">
          <tspan class="j-key">"code"</tspan><tspan class="j-colon">: </tspan><tspan class="j-num">404</tspan><tspan class="j-colon">,</tspan>
        </text>

        <!-- Line 4: message informative -->
        <text x="20" y="94">
          <tspan class="j-key">"message"</tspan><tspan class="j-colon">: </tspan><tspan class="j-str">"Produk dengan ID 9999 tidak ditemukan"</tspan><tspan class="j-colon">,</tspan>
        </text>

        <!-- Line 5: data null -->
        <text x="20" y="118">
          <tspan class="j-key">"data"</tspan><tspan class="j-colon">: </tspan><tspan class="j-null">null</tspan><tspan class="j-colon">,</tspan>
        </text>

        <!-- Line 6: timestamp -->
        <text x="20" y="142">
          <tspan class="j-key">"timestamp"</tspan><tspan class="j-colon">: </tspan><tspan class="j-str-safe">"2026-11-08T09:36:45+07:00"</tspan>
        </text>

        <!-- Line 7: root close -->
        <text x="0" y="166" class="j-brace">}</text>

        <!-- Visual Decorative Callout underneath code -->
        <g transform="translate(0, 240)">
          <rect x="0" y="0" width="560" height="230" rx="10" fill="#fef2f2" stroke="#fecaca" stroke-width="1" />
          <circle cx="28" cy="28" r="12" fill="#fee2e2" stroke="#f87171" stroke-width="1" />
          <text x="28" y="33" font-family="'Segoe UI', Arial, sans-serif" font-size="14px" font-weight="bold" fill="#dc2626" text-anchor="middle">!</text>
          
          <text x="50" y="32" font-family="'Segoe UI', Arial, sans-serif" font-size="12px" font-weight="bold" fill="#991b1b">
            Standar Penanganan Galat REST API (Soal 12 Poin e)
          </text>
          
          <text x="20" y="70" font-family="'Segoe UI', Arial, sans-serif" font-size="10.5px" fill="#7f1d1d">
            &bull; <tspan font-weight="bold">HTTP Status Header Sejati:</tspan> Mengirim header <tspan font-family="'Consolas', monospace">http_response_code(404)</tspan> ke browser/klien.
          </text>
          <text x="20" y="100" font-family="'Segoe UI', Arial, sans-serif" font-size="10.5px" fill="#7f1d1d">
            &bull; <tspan font-weight="bold">Format JSON Konsisten:</tspan> Menjaga format JSON tetap valid sekalipun terjadi galat.
          </text>
          <text x="20" y="130" font-family="'Segoe UI', Arial, sans-serif" font-size="10.5px" fill="#7f1d1d">
            &bull; <tspan font-weight="bold">Pesan Ramah Pengembang (Human-Readable):</tspan> Memberikan alasan jelas mengapa data gagal dimuat.
          </text>
          <text x="20" y="160" font-family="'Segoe UI', Arial, sans-serif" font-size="10.5px" fill="#7f1d1d">
            &bull; <tspan font-weight="bold">Data Null Safe:</tspan> Nilai <tspan font-family="'Consolas', monospace">"data": null</tspan> mencegah error null pointer pada aplikasi Android/iOS.
          </text>
          <text x="20" y="195" font-family="'Segoe UI', Arial, sans-serif" font-size="10.5px" font-weight="bold" fill="#b91c1c">
            &bull; Dosen &amp; Penguji dapat memverifikasi pengujian ini secara langsung di Postman atau Browser.
          </text>
        </g>
      </g>

      <!-- RIGHT: Anatomy & Architectural Explanation Panel (296px) -->
      <g id="Explanation-Panel" transform="translate(668, 12)">
        
        <!-- Section Header -->
        <text x="0" y="14" font-family="'Segoe UI', Arial, sans-serif" font-size="12px" font-weight="bold" fill="#0f172a">
          ANATOMI PENANGANAN GALAT
        </text>
        <text x="0" y="28" font-family="'Segoe UI', Arial, sans-serif" font-size="9.5px" fill="#64748b">
          Soal 12 Poin e: Error &amp; Not Found Handling
        </text>

        <!-- Card 1: HTTP 404 Status -->
        <g transform="translate(0, 40)">
          <rect x="0" y="0" width="296" height="110" class="panel-card" />
          <circle cx="16" cy="18" r="4" fill="#dc2626" />
          <text x="28" y="22" class="panel-header">1. Respon HTTP 404 Not Found</text>
          <text x="14" y="42" class="panel-text">
            Ketika ID parameter tidak ada di tabel:
          </text>
          <text x="14" y="58" class="panel-text">
            <tspan font-weight="bold">WHERE id = ?</tspan> mengembalikan 0 baris,
          </text>
          <text x="14" y="74" class="panel-text">
            API mengembalikan kode status <tspan font-weight="bold" fill="#dc2626">404 Not Found</tspan>.
          </text>
          <text x="14" y="96" class="panel-tag">&bull; Bukan 200 OK kosong</text>
        </g>

        <!-- Card 2: JSON Standard Envelope -->
        <g transform="translate(0, 160)">
          <rect x="0" y="0" width="296" height="120" class="panel-card" />
          <circle cx="16" cy="18" r="4" fill="#b45309" />
          <text x="28" y="22" class="panel-header">2. Konsistensi Kontrak API</text>
          <text x="14" y="42" class="panel-text">
            Klien (Flutter/React Native) tidak crash
          </text>
          <text x="14" y="58" class="panel-text">
            karena struktur objek selalu seragam:
          </text>
          <text x="14" y="76" class="panel-text">
            memiliki properti <tspan class="font-url">status, code, message</tspan>.
          </text>
          <text x="14" y="94" class="panel-text">
            Pengecekan di klien cukup <tspan class="font-url">if (res.code == 200)</tspan>.
          </text>
          <text x="14" y="112" class="panel-tag">&bull; Standard Defensive API Design</text>
        </g>

        <!-- Card 3: Keamanan & Sanitasi -->
        <g transform="translate(0, 290)">
          <rect x="0" y="0" width="296" height="120" class="panel-card" />
          <circle cx="16" cy="18" r="4" fill="#0369a1" />
          <text x="28" y="22" class="panel-header">3. Keamanan SQL &amp; Data</text>
          <text x="14" y="42" class="panel-text">
            Pesan error <tspan font-weight="bold">tidak mengekspos</tspan> syntax
          </text>
          <text x="14" y="60" class="panel-text">
            query MySQL, nama tabel, atau username database
          </text>
          <text x="14" y="78" class="panel-text">
            sehingga aman dari <tspan font-style="italic">Information Disclosure</tspan>.
          </text>
          <text x="14" y="96" class="panel-text">
            Menggunakan MySQLi Prepared Statements.
          </text>
          <text x="14" y="114" class="panel-tag">&bull; OWASP Security Compliant</text>
        </g>

        <!-- Card 4: Figma Vector Notice -->
        <g transform="translate(0, 420)">
          <rect x="0" y="0" width="296" height="180" rx="8" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1" />
          <text x="14" y="24" font-family="'Segoe UI', Arial, sans-serif" font-size="11px" font-weight="bold" fill="#1e40af">
            FIGMA DRAG &amp; DROP READY
          </text>
          <text x="14" y="45" class="panel-text" fill="#1e3a8a">
            File SVG ini 100% menggunakan elemen
          </text>
          <text x="14" y="62" class="panel-text" fill="#1e3a8a">
            teks &amp; bentuk native. Cukup tarik file
          </text>
          <text x="14" y="80" class="panel-text" fill="#1e3a8a">
            ke kanvas Figma, semua teks langsung
          </text>
          <text x="14" y="98" class="panel-text" fill="#1e3a8a">
            terurai menjadi layer yang dapat diedit!
          </text>
          
          <rect x="14" y="125" width="267" height="34" rx="6" fill="#1d4ed8" />
          <text x="147" y="146" font-family="'Segoe UI', Arial, sans-serif" font-size="10.5px" font-weight="bold" fill="#ffffff" text-anchor="middle">
            100% Vector &bull; Editable in Figma
          </text>
        </g>

      </g>

    </g>

  </g>

</svg>