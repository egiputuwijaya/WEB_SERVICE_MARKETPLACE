<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 840" width="100%" height="100%">
  <defs>
    <style>
      .canvas-bg { fill: #f8fafc; }
      .window-bg { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.5; rx: 12px; }
      .window-header { fill: #f1f5f9; stroke: #cbd5e1; stroke-width: 1; }
      .tab-bar { fill: #ffffff; stroke: #e2e8f0; stroke-width: 1; }
      .code-area { fill: #ffffff; stroke: #e2e8f0; stroke-width: 1; }
      .line-num-bg { fill: #f8fafc; stroke: #e2e8f0; stroke-width: 0.8; }
      
      /* Typography */
      .font-title { font-family: 'Segoe UI', Arial, sans-serif; font-size: 16px; font-weight: bold; fill: #0f172a; }
      .font-sub { font-family: 'Segoe UI', Arial, sans-serif; font-size: 10px; fill: #64748b; }
      .font-url { font-family: 'Consolas', 'Courier New', monospace; font-size: 11px; fill: #1e293b; font-weight: bold; }
      .font-line-num { font-family: 'Consolas', monospace; font-size: 9.5px; fill: #94a3b8; text-anchor: end; }
      
      /* JSON Code Highlighting */
      .json-text { font-family: 'Consolas', 'Courier New', monospace; font-size: 10.5px; }
      .j-brace { fill: #334155; font-weight: bold; }
      .j-key { fill: #0369a1; font-weight: bold; }      /* Blue for Keys */
      .j-str { fill: #15803d; }                         /* Green for Strings */
      .j-num { fill: #b45309; font-weight: bold; }      /* Amber/Brown for Numbers */
      .j-null { fill: #dc2626; font-weight: bold; }     /* Red for Null/Boolean */
      .j-colon { fill: #64748b; }
      
      /* Right Explanation Panel */
      .panel-card { fill: #f8fafc; stroke: #e2e8f0; stroke-width: 1; rx: 8px; }
      .panel-header { font-family: 'Segoe UI', Arial, sans-serif; font-size: 11px; font-weight: bold; fill: #0f172a; }
      .panel-text { font-family: 'Segoe UI', Arial, sans-serif; font-size: 9px; fill: #475569; line-height: 1.4; }
      .panel-tag { font-family: 'Consolas', monospace; font-size: 8.5px; fill: #15803d; }
      
      /* Badges */
      .badge-post { fill: #f0fdf4; stroke: #22c55e; stroke-width: 1; rx: 4px; }
      .badge-post-text { font-family: 'Consolas', monospace; font-size: 10px; font-weight: bold; fill: #15803d; text-anchor: middle; }
      .badge-status { fill: #ecfdf5; stroke: #10b981; stroke-width: 1; rx: 12px; }
      .badge-status-text { font-family: 'Segoe UI', Arial, sans-serif; font-size: 10px; font-weight: bold; fill: #047857; text-anchor: middle; }
      .badge-meta { fill: #f1f5f9; stroke: #cbd5e1; stroke-width: 0.8; rx: 4px; }
      .badge-meta-text { font-family: 'Consolas', monospace; font-size: 9px; fill: #475569; text-anchor: middle; }
    </style>
  </defs>

  <!-- Canvas Background -->
  <rect width="1060" height="840" class="canvas-bg" />

  <!-- Main Window Card -->
  <g id="Api-Mockup-Window" transform="translate(30, 25)">
    <!-- Window Outer Shell -->
    <rect x="0" y="0" width="1000" height="790" rx="14" class="window-bg" filter="drop-shadow(0 12px 24px rgba(15,23,42,0.08))" />
    
    <!-- Window Header / Title Bar -->
    <path d="M 0,14 Q 0,0 14,0 L 986,0 Q 1000,0 1000,14 L 1000,52 L 0,52 Z" class="window-header" />
    
    <!-- Window Control Buttons (macOS Dots) -->
    <circle cx="24" cy="26" r="6" fill="#ef4444" stroke="#dc2626" stroke-width="0.5" />
    <circle cx="44" cy="26" r="6" fill="#f59e0b" stroke="#d97706" stroke-width="0.5" />
    <circle cx="64" cy="26" r="6" fill="#10b981" stroke="#059669" stroke-width="0.5" />

    <!-- Application / Brand Title in Header -->
    <text x="90" y="31" class="font-title">Herbapedia REST API &mdash; Respon Sukses Pembuatan Pesanan Baru</text>
    <text x="640" y="31" class="font-sub">SOAL 12 POINT C &amp; D &bull; POST /api/pesanan.php</text>

    <!-- Request URL & Action Bar -->
    <g id="URL-Bar" transform="translate(18, 62)">
      <!-- URL Bar Container -->
      <rect x="0" y="0" width="964" height="42" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1" />
      
      <!-- HTTP Method Badge (POST) -->
      <rect x="10" y="8" width="56" height="26" class="badge-post" />
      <text x="38" y="25" class="badge-post-text">POST</text>

      <!-- URL Input Box -->
      <text x="76" y="26" class="font-url">http://localhost/MARKETPLACE/WEB%20SERVICE%20MARKETPLACE/api/pesanan.php</text>

      <!-- Status Code Badge (201 Created) -->
      <g transform="translate(670, 8)">
        <rect x="0" y="0" width="115" height="26" class="badge-status" />
        <circle cx="14" cy="13" r="4" fill="#10b981" />
        <text x="65" y="17" class="badge-status-text">201 Created</text>
      </g>

      <!-- Response Time Badge -->
      <g transform="translate(793, 8)">
        <rect x="0" y="0" width="75" height="26" class="badge-meta" />
        <text x="37" y="17" class="badge-meta-text">42 ms</text>
      </g>

      <!-- Response Size Badge -->
      <g transform="translate(876, 8)">
        <rect x="0" y="0" width="78" height="26" class="badge-meta" />
        <text x="39" y="17" class="badge-meta-text">920 B</text>
      </g>
    </g>

    <!-- Tab Strip (Response Preview Header) -->
    <g id="Tab-Strip" transform="translate(18, 114)">
      <rect x="0" y="0" width="964" height="32" class="tab-bar" />
      <!-- Active Tab -->
      <rect x="0" y="0" width="130" height="32" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" />
      <line x1="0" y1="0" x2="130" y2="0" stroke="#15803d" stroke-width="3" />
      <text x="65" y="20" font-family="'Segoe UI', Arial, sans-serif" font-size="11px" font-weight="bold" fill="#0f172a" text-anchor="middle">Body (JSON)</text>
      
      <!-- Inactive Tabs -->
      <text x="180" y="20" font-family="'Segoe UI', Arial, sans-serif" font-size="11px" fill="#64748b" text-anchor="middle">Headers (8)</text>
      <text x="260" y="20" font-family="'Segoe UI', Arial, sans-serif" font-size="11px" fill="#64748b" text-anchor="middle">Cookies (0)</text>
      
      <!-- Content Type indicator -->
      <text x="950" y="20" font-family="'Consolas', monospace" font-size="10px" fill="#64748b" text-anchor="end">application/json; charset=UTF-8</text>
    </g>

    <!-- Two-Column Workspace: Code View (Left 650px) + Anatomy Panel (Right 296px) -->
    <g id="Workspace-Body" transform="translate(18, 146)">
      
      <!-- LEFT: JSON Code Area Container -->
      <rect x="0" y="0" width="650" height="625" class="code-area" />
      
      <!-- Line Number Column Background -->
      <rect x="0" y="0" width="38" height="625" class="line-num-bg" />
      <line x1="38" y1="0" x2="38" y2="625" stroke="#e2e8f0" stroke-width="1" />

      <!-- Line Numbers (1 to 32) -->
      <g id="Line-Numbers" class="font-line-num">
        <text x="30" y="22">1</text><text x="30" y="41">2</text><text x="30" y="60">3</text>
        <text x="30" y="79">4</text><text x="30" y="98">5</text><text x="30" y="117">6</text>
        <text x="30" y="136">7</text><text x="30" y="155">8</text><text x="30" y="174">9</text>
        <text x="30" y="193">10</text><text x="30" y="212">11</text><text x="30" y="231">12</text>
        <text x="30" y="250">13</text><text x="30" y="269">14</text><text x="30" y="288">15</text>
        <text x="30" y="307">16</text><text x="30" y="326">17</text><text x="30" y="345">18</text>
        <text x="30" y="364">19</text><text x="30" y="383">20</text><text x="30" y="402">21</text>
        <text x="30" y="421">22</text><text x="30" y="440">23</text><text x="30" y="459">24</text>
        <text x="30" y="478">25</text><text x="30" y="497">26</text><text x="30" y="516">27</text>
        <text x="30" y="535">28</text><text x="30" y="554">29</text><text x="30" y="573">30</text>
        <text x="30" y="592">31</text><text x="30" y="611">32</text>
      </g>

      <!-- JSON Syntax Highlighting Content -->
      <g id="JSON-Content" class="json-text" transform="translate(48, 0)">
        <!-- Line 1 -->
        <text x="0" y="22" class="j-brace">{</text>
        
        <!-- Line 2: status -->
        <text x="16" y="41">
          <tspan class="j-key">"status"</tspan><tspan class="j-colon">: </tspan><tspan class="j-str">"success"</tspan><tspan class="j-colon">,</tspan>
        </text>

        <!-- Line 3: code -->
        <text x="16" y="60">
          <tspan class="j-key">"code"</tspan><tspan class="j-colon">: </tspan><tspan class="j-num">201</tspan><tspan class="j-colon">,</tspan>
        </text>

        <!-- Line 4: message -->
        <text x="16" y="79">
          <tspan class="j-key">"message"</tspan><tspan class="j-colon">: </tspan><tspan class="j-str">"Pesanan berhasil dibuat &amp; stok dikurangi"</tspan><tspan class="j-colon">,</tspan>
        </text>

        <!-- Line 5: data -->
        <text x="16" y="98">
          <tspan class="j-key">"data"</tspan><tspan class="j-colon">: </tspan><tspan class="j-brace">{</tspan>
        </text>

        <!-- Line 6: id -->
        <text x="32" y="117">
          <tspan class="j-key">"id"</tspan><tspan class="j-colon">: </tspan><tspan class="j-num">4</tspan><tspan class="j-colon">,</tspan>
        </text>

        <!-- Line 7: kode_pesanan -->
        <text x="32" y="136">
          <tspan class="j-key">"kode_pesanan"</tspan><tspan class="j-colon">: </tspan><tspan class="j-str">"ORD-20261108-8921"</tspan><tspan class="j-colon">,</tspan>
        </text>

        <!-- Line 8: tanggal_pesanan -->
        <text x="32" y="155">
          <tspan class="j-key">"tanggal_pesanan"</tspan><tspan class="j-colon">: </tspan><tspan class="j-str">"2026-11-08 09:35:12"</tspan><tspan class="j-colon">,</tspan>
        </text>

        <!-- Line 9: status_pesanan -->
        <text x="32" y="174">
          <tspan class="j-key">"status_pesanan"</tspan><tspan class="j-colon">: </tspan><tspan class="j-str">"menunggu_pembayaran"</tspan><tspan class="j-colon">,</tspan>
        </text>

        <!-- Line 10: total_bayar -->
        <text x="32" y="193">
          <tspan class="j-key">"total_bayar"</tspan><tspan class="j-colon">: </tspan><tspan class="j-num">170000</tspan><tspan class="j-colon">,</tspan>
        </text>

        <!-- Line 11: total_bayar_formatted -->
        <text x="32" y="212">
          <tspan class="j-key">"total_bayar_formatted"</tspan><tspan class="j-colon">: </tspan><tspan class="j-str">"Rp 170.000"</tspan><tspan class="j-colon">,</tspan>
        </text>

        <!-- Line 12: metode_pembayaran -->
        <text x="32" y="231">
          <tspan class="j-key">"metode_pembayaran"</tspan><tspan class="j-colon">: </tspan><tspan class="j-str">"Transfer Bank Mandiri"</tspan><tspan class="j-colon">,</tspan>
        </text>

        <!-- Line 13: status_pembayaran -->
        <text x="32" y="250">
          <tspan class="j-key">"status_pembayaran"</tspan><tspan class="j-colon">: </tspan><tspan class="j-str">"pending"</tspan><tspan class="j-colon">,</tspan>
        </text>

        <!-- Line 14: alamat_pengiriman -->
        <text x="32" y="269">
          <tspan class="j-key">"alamat_pengiriman"</tspan><tspan class="j-colon">: </tspan><tspan class="j-str">"Jl. Kaliurang KM 5 No. 12, Sleman"</tspan><tspan class="j-colon">,</tspan>
        </text>

        <!-- Line 15: items array -->
        <text x="32" y="288">
          <tspan class="j-key">"items"</tspan><tspan class="j-colon">: [</tspan>
        </text>

        <!-- Line 16: item 1 open -->
        <text x="48" y="307">
          <tspan class="j-brace">{</tspan>
        </text>

        <!-- Line 17: produk_id -->
        <text x="64" y="326">
          <tspan class="j-key">"produk_id"</tspan><tspan class="j-colon">: </tspan><tspan class="j-num">1</tspan><tspan class="j-colon">,</tspan>
        </text>

        <!-- Line 18: kode_produk -->
        <text x="64" y="345">
          <tspan class="j-key">"kode_produk"</tspan><tspan class="j-colon">: </tspan><tspan class="j-str">"HRB-001"</tspan><tspan class="j-colon">,</tspan>
        </text>

        <!-- Line 19: nama_produk -->
        <text x="64" y="364">
          <tspan class="j-key">"nama_produk"</tspan><tspan class="j-colon">: </tspan><tspan class="j-str">"Madu Habbatussauda Premium"</tspan><tspan class="j-colon">,</tspan>
        </text>

        <!-- Line 20: harga_satuan -->
        <text x="64" y="383">
          <tspan class="j-key">"harga_satuan"</tspan><tspan class="j-colon">: </tspan><tspan class="j-num">85000</tspan><tspan class="j-colon">,</tspan>
        </text>

        <!-- Line 21: jumlah -->
        <text x="64" y="402">
          <tspan class="j-key">"jumlah"</tspan><tspan class="j-colon">: </tspan><tspan class="j-num">2</tspan><tspan class="j-colon">,</tspan>
        </text>

        <!-- Line 22: subtotal -->
        <text x="64" y="421">
          <tspan class="j-key">"subtotal"</tspan><tspan class="j-colon">: </tspan><tspan class="j-num">170000</tspan><tspan class="j-colon">,</tspan>
        </text>

        <!-- Line 23: sisa_stok -->
        <text x="64" y="440">
          <tspan class="j-key">"sisa_stok_gudang"</tspan><tspan class="j-colon">: </tspan><tspan class="j-num">48</tspan>
        </text>

        <!-- Line 24: item close -->
        <text x="48" y="459">
          <tspan class="j-brace">}</tspan>
        </text>

        <!-- Line 25: items close -->
        <text x="32" y="478">
          <tspan class="j-brace">],</tspan>
        </text>

        <!-- Line 26: summary ACID -->
        <text x="32" y="497">
          <tspan class="j-key">"transaksi_database"</tspan><tspan class="j-colon">: </tspan><tspan class="j-brace">{</tspan>
        </text>
        <text x="48" y="516">
          <tspan class="j-key">"mode"</tspan><tspan class="j-colon">: </tspan><tspan class="j-str">"ACID_TRANSACTION"</tspan><tspan class="j-colon">,</tspan>
        </text>
        <text x="48" y="535">
          <tspan class="j-key">"commit"</tspan><tspan class="j-colon">: </tspan><tspan class="j-str">"success"</tspan>
        </text>
        <text x="32" y="554">
          <tspan class="j-brace">}</tspan>
        </text>

        <!-- Line 30: data close -->
        <text x="16" y="573">
          <tspan class="j-brace">},</tspan>
        </text>

        <!-- Line 31: timestamp -->
        <text x="16" y="592">
          <tspan class="j-key">"timestamp"</tspan><tspan class="j-colon">: </tspan><tspan class="j-str">"2026-11-08T09:35:12+07:00"</tspan>
        </text>

        <!-- Line 32: root close -->
        <text x="0" y="611" class="j-brace">}</text>
      </g>

      <!-- RIGHT: Anatomy & Architectural Explanation Panel (296px) -->
      <g id="Explanation-Panel" transform="translate(668, 12)">
        
        <!-- Section Header -->
        <text x="0" y="14" font-family="'Segoe UI', Arial, sans-serif" font-size="12px" font-weight="bold" fill="#0f172a">
          ANATOMI RESPON TRANSAKSI
        </text>
        <text x="0" y="28" font-family="'Segoe UI', Arial, sans-serif" font-size="9.5px" fill="#64748b">
          Soal 12 Poin b (No. 4) &amp; Poin e
        </text>

        <!-- Card 1: HTTP 201 Created -->
        <g transform="translate(0, 40)">
          <rect x="0" y="0" width="296" height="110" class="panel-card" />
          <circle cx="16" cy="18" r="4" fill="#15803d" />
          <text x="28" y="22" class="panel-header">1. Respon HTTP 201 Created</text>
          <text x="14" y="42" class="panel-text">
            Sesuai konvensi RESTful API, operasi
          </text>
          <text x="14" y="58" class="panel-text">
            <tspan font-weight="bold">POST</tspan> yang berhasil membuat data entitas baru
          </text>
          <text x="14" y="74" class="panel-text">
            mengembalikan status <tspan font-weight="bold" fill="#15803d">201 Created</tspan> (bukan 200).
          </text>
          <text x="14" y="96" class="panel-tag">&bull; HTTP Standard: RFC 7231 Section 6.3.2</text>
        </g>

        <!-- Card 2: Validasi Stok & ACID -->
        <g transform="translate(0, 160)">
          <rect x="0" y="0" width="296" height="120" class="panel-card" />
          <circle cx="16" cy="18" r="4" fill="#0369a1" />
          <text x="28" y="22" class="panel-header">2. Transaksi Aman (ACID)</text>
          <text x="14" y="42" class="panel-text">
            API menjalankan kunci baris:
          </text>
          <text x="14" y="58" class="panel-text">
            <tspan class="font-url">SELECT stok FROM produk FOR UPDATE</tspan>
          </text>
          <text x="14" y="76" class="panel-text">
            Mencegah <tspan font-style="italic">race condition</tspan> dan otomatis
          </text>
          <text x="14" y="94" class="panel-text">
            mengurangi kuantitas stok di tabel produk.
          </text>
          <text x="14" y="112" class="panel-tag">&bull; auto-decrement: 50 &rarr; 48 botol</text>
        </g>

        <!-- Card 3: Data Kembalian Lengkap -->
        <g transform="translate(0, 290)">
          <rect x="0" y="0" width="296" height="120" class="panel-card" />
          <circle cx="16" cy="18" r="4" fill="#b45309" />
          <text x="28" y="22" class="panel-header">3. Payload Data Pesanan</text>
          <text x="14" y="42" class="panel-text">
            Mengembalikan kode pesanan unik:
          </text>
          <text x="14" y="60" class="panel-text">
            <tspan font-weight="bold" fill="#0f172a">ORD-20261108-8921</tspan> beserta rincian
          </text>
          <text x="14" y="78" class="panel-text">
            item barang, subtotal, dan metode transfer
          </text>
          <text x="14" y="96" class="panel-text">
            untuk mempermudah UI aplikasi pemanggil.
          </text>
          <text x="14" y="114" class="panel-tag">&bull; Siap dipakai di Mobile App &amp; Web</text>
        </g>

        <!-- Card 4: Figma Vector Notice -->
        <g transform="translate(0, 420)">
          <rect x="0" y="0" width="296" height="180" rx="8" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1" />
          <text x="14" y="24" font-family="'Segoe UI', Arial, sans-serif" font-size="11px" font-weight="bold" fill="#1e40af">
            FIGMA DRAG &amp; DROP READY
          </text>
          <text x="14" y="45" class="panel-text" fill="#1e3a8a">
            File SVG ini 100% menggunakan elemen
          </text>
          <text x="14" y="62" class="panel-text" fill="#1e3a8a">
            teks &amp; bentuk native. Cukup tarik file
          </text>
          <text x="14" y="80" class="panel-text" fill="#1e3a8a">
            ke kanvas Figma, semua teks langsung
          </text>
          <text x="14" y="98" class="panel-text" fill="#1e3a8a">
            terurai menjadi layer yang dapat diedit!
          </text>
          
          <rect x="14" y="125" width="267" height="34" rx="6" fill="#1d4ed8" />
          <text x="147" y="146" font-family="'Segoe UI', Arial, sans-serif" font-size="10.5px" font-weight="bold" fill="#ffffff" text-anchor="middle">
            100% Vector &bull; Editable in Figma
          </text>
        </g>

      </g>

    </g>

  </g>

</svg>