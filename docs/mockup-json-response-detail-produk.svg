<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 840" width="100%" height="100%">
  <defs>
    <style>
      .canvas-bg { fill: #f8fafc; }
      .window-bg { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.5; rx: 12px; }
      .window-header { fill: #f1f5f9; stroke: #cbd5e1; stroke-width: 1; }
      .tab-bar { fill: #ffffff; stroke: #e2e8f0; stroke-width: 1; }
      .line-num-bg { fill: #f8fafc; stroke: #e2e8f0; stroke-width: 0.8; }
      
      /* Typography */
      .font-title { font-family: 'Segoe UI', Arial, sans-serif; font-size: 16px; font-weight: bold; fill: #0f172a; }
      .font-sub { font-family: 'Segoe UI', Arial, sans-serif; font-size: 10px; fill: #64748b; }
      .font-url { font-family: 'Consolas', 'Courier New', monospace; font-size: 11px; fill: #1e293b; font-weight: bold; }
      .font-line-num { font-family: 'Consolas', monospace; font-size: 9.5px; fill: #94a3b8; text-anchor: end; }
      
      /* JSON Code Highlighting */
      .json-text { font-family: 'Consolas', 'Courier New', monospace; font-size: 10px; }
      .j-brace { fill: #334155; font-weight: bold; }
      .j-key { fill: #0369a1; font-weight: bold; }      /* Blue for Keys */
      .j-str { fill: #15803d; }                         /* Green for Strings */
      .j-num { fill: #b45309; font-weight: bold; }      /* Amber/Brown for Numbers */
      .j-null { fill: #dc2626; font-weight: bold; }     /* Red for Null/Boolean */
      .j-colon { fill: #64748b; }
      
      /* Right Explanation Panel */
      .panel-card { fill: #f8fafc; stroke: #e2e8f0; stroke-width: 1; rx: 8px; }
      .panel-header { font-family: 'Segoe UI', Arial, sans-serif; font-size: 11px; font-weight: bold; fill: #0f172a; }
      .panel-text { font-family: 'Segoe UI', Arial, sans-serif; font-size: 9px; fill: #475569; line-height: 1.4; }
      .panel-tag { font-family: 'Consolas', monospace; font-size: 8.5px; fill: #2563eb; }
      
      /* Badges */
      .badge-get { fill: #eff6ff; stroke: #3b82f6; stroke-width: 1; rx: 4px; }
      .badge-get-text { font-family: 'Consolas', monospace; font-size: 10px; font-weight: bold; fill: #1d4ed8; text-anchor: middle; }
      .badge-status { fill: #ecfdf5; stroke: #10b981; stroke-width: 1; rx: 12px; }
      .badge-status-text { font-family: 'Segoe UI', Arial, sans-serif; font-size: 9px; font-weight: bold; fill: #065f46; text-anchor: middle; }
    </style>

    <filter id="shadow-window-detail" x="-2%" y="-2%" width="104%" height="106%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.08" />
    </filter>
  </defs>

  <!-- Canvas Outer Background -->
  <rect x="2" y="2" width="1056" height="836" rx="14" class="canvas-bg" stroke="#1f2937" stroke-width="2.5" />

  <!-- ========================================================================= -->
  <!-- TOP HEADER & TITLE                                                        -->
  <!-- ========================================================================= -->
  <rect x="2" y="2" width="1056" height="66" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2" />
  <rect x="28" y="16" width="34" height="34" rx="8" fill="#1f2937" />
  <text x="45" y="38" font-family="'Segoe UI', Arial, sans-serif" font-size="15px" fill="#ffffff" font-weight="bold" text-anchor="middle">{ }</text>
  <text x="74" y="32" class="font-title">Rancangan Mockup Respon JSON: Detail Produk Sediaan Herbal</text>
  <text x="74" y="48" class="font-sub">Herbapedia — PT Herbal Sejati Indonesia  |  Respon Sukses GET /api/produk.php?id=1 (Soal 12 Poin c &amp; h)</text>

  <rect x="870" y="20" width="160" height="26" rx="13" fill="#ecfdf5" stroke="#a7f3d0" stroke-width="1" />
  <text x="950" y="36" font-family="'Segoe UI', Arial, sans-serif" font-size="9px" font-weight="bold" fill="#065f46" text-anchor="middle">✓ Detail Kaya &amp; Legalitas BPOM</text>

  <!-- ========================================================================= -->
  <!-- MAIN WINDOW FRAME                                                         -->
  <!-- ========================================================================= -->
  <g transform="translate(28, 80)">
    
    <rect x="0" y="0" width="1004" height="730" rx="12" class="window-bg" filter="url(#shadow-window-detail)" />

    <!-- 1. Window Top Bar -->
    <rect x="0" y="0" width="1004" height="48" rx="12" class="window-header" />
    <rect x="0" y="24" width="1004" height="24" fill="#f1f5f9" />
    
    <circle cx="20" cy="24" r="5" fill="#ef4444" />
    <circle cx="36" cy="24" r="5" fill="#f59e0b" />
    <circle cx="52" cy="24" r="5" fill="#10b981" />

    <!-- Method Pill -->
    <rect x="75" y="13" width="46" height="22" class="badge-get" />
    <text x="98" y="28" class="badge-get-text">GET</text>

    <!-- URL Box with parameter -->
    <rect x="128" y="11" width="560" height="26" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" />
    <text x="140" y="28" class="font-url">http://localhost/WEB SERVICE MARKETPLACE/api/produk.php?id=1</text>

    <!-- Response Status Badges -->
    <rect x="702" y="13" width="88" height="22" class="badge-status" />
    <text x="746" y="28" class="badge-status-text">✓ 200 OK</text>

    <rect x="796" y="13" width="70" height="22" rx="4" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1" />
    <text x="831" y="27" font-family="'Consolas', monospace" font-size="9px" fill="#475569" text-anchor="middle">⏱ 14 ms</text>

    <rect x="872" y="13" width="70" height="22" rx="4" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1" />
    <text x="907" y="27" font-family="'Consolas', monospace" font-size="9px" fill="#475569" text-anchor="middle">📦 1.1 KB</text>

    <rect x="948" y="13" width="44" height="22" rx="4" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1" />
    <text x="970" y="27" font-family="'Consolas', monospace" font-size="9px" fill="#0369a1" font-weight="bold" text-anchor="middle">JSON</text>

    <!-- 2. Sub-Header -->
    <rect x="0" y="48" width="1004" height="32" class="tab-bar" />
    <text x="20" y="69" font-family="'Segoe UI', Arial, sans-serif" font-size="10.5px" font-weight="bold" fill="#2563eb">Response Body (Pretty)</text>
    <line x1="16" y1="78" x2="135" y2="78" stroke="#2563eb" stroke-width="2.5" />
    <text x="160" y="69" font-family="'Segoe UI', Arial, sans-serif" font-size="10.5px" fill="#64748b">Headers (7)</text>
    <text x="984" y="68" font-family="'Consolas', monospace" font-size="9px" fill="#64748b" text-anchor="end">Content-Type: application/json; charset=UTF-8</text>

    <!-- 3. Line Numbers & Code -->
    <rect x="0" y="80" width="38" height="650" rx="0" class="line-num-bg" />
    <line x1="38" y1="80" x2="38" y2="730" stroke="#e2e8f0" stroke-width="1" />

    <g class="font-line-num">
      <text x="28" y="103">1</text>
      <text x="28" y="123">2</text>
      <text x="28" y="143">3</text>
      <text x="28" y="163">4</text>
      <text x="28" y="183">5</text>
      <text x="28" y="203">6</text>
      <text x="28" y="223">7</text>
      <text x="28" y="243">8</text>
      <text x="28" y="263">9</text>
      <text x="28" y="283">10</text>
      <text x="28" y="303">11</text>
      <text x="28" y="323">12</text>
      <text x="28" y="343">13</text>
      <text x="28" y="363">14</text>
      <text x="28" y="383">15</text>
      <text x="28" y="403">16</text>
      <text x="28" y="423">17</text>
      <text x="28" y="443">18</text>
      <text x="28" y="463">19</text>
      <text x="28" y="483">20</text>
      <text x="28" y="503">21</text>
      <text x="28" y="523">22</text>
      <text x="28" y="543">23</text>
      <text x="28" y="563">24</text>
      <text x="28" y="583">25</text>
      <text x="28" y="603">26</text>
      <text x="28" y="623">27</text>
      <text x="28" y="643">28</text>
      <text x="28" y="663">29</text>
      <text x="28" y="683">30</text>
      <text x="28" y="703">31</text>
    </g>

    <!-- Syntax Highlighted JSON Code Lines (Detail Sediaan) -->
    <g class="json-text" transform="translate(48, 0)">
      <text x="0" y="103" class="j-brace">{</text>
      <text x="16" y="123"><tspan class="j-key">"status"</tspan><tspan class="j-colon">: </tspan><tspan class="j-str">"success"</tspan><tspan class="j-brace">,</tspan></text>
      <text x="16" y="143"><tspan class="j-key">"code"</tspan><tspan class="j-colon">: </tspan><tspan class="j-num">200</tspan><tspan class="j-brace">,</tspan></text>
      <text x="16" y="163"><tspan class="j-key">"message"</tspan><tspan class="j-colon">: </tspan><tspan class="j-str">"Detail produk ID 1 berhasil ditemukan."</tspan><tspan class="j-brace">,</tspan></text>
      <text x="16" y="183"><tspan class="j-key">"data"</tspan><tspan class="j-colon">: </tspan><tspan class="j-brace">{</tspan></text>
      
      <text x="32" y="203"><tspan class="j-key">"id_produk"</tspan><tspan class="j-colon">: </tspan><tspan class="j-num">1</tspan><tspan class="j-brace">,</tspan></text>
      <text x="32" y="223"><tspan class="j-key">"nama_produk"</tspan><tspan class="j-colon">: </tspan><tspan class="j-str">"Curcuma Forte Ekstrak Temulawak 60 Kapsul (BPOM TR213387651)"</tspan><tspan class="j-brace">,</tspan></text>
      <text x="32" y="243"><tspan class="j-key">"deskripsi"</tspan><tspan class="j-colon">: </tspan><tspan class="j-str">"Ekstrak Temulawak terstandarisasi kurkuminoid tinggi murni..."</tspan><tspan class="j-brace">,</tspan></text>
      <text x="32" y="263"><tspan class="j-key">"harga"</tspan><tspan class="j-colon">: </tspan><tspan class="j-num">145000</tspan><tspan class="j-brace">, </tspan><tspan class="j-key">"harga_format"</tspan><tspan class="j-colon">: </tspan><tspan class="j-str">"Rp 145.000"</tspan><tspan class="j-brace">,</tspan></text>
      <text x="32" y="283"><tspan class="j-key">"stok"</tspan><tspan class="j-colon">: </tspan><tspan class="j-num">45</tspan><tspan class="j-brace">, </tspan><tspan class="j-key">"satuan"</tspan><tspan class="j-colon">: </tspan><tspan class="j-str">"botol"</tspan><tspan class="j-brace">, </tspan><tspan class="j-key">"foto"</tspan><tspan class="j-colon">: </tspan><tspan class="j-str">"curcuma-forte.svg"</tspan><tspan class="j-brace">, </tspan><tspan class="j-key">"status"</tspan><tspan class="j-colon">: </tspan><tspan class="j-str">"aktif"</tspan><tspan class="j-brace">,</tspan></text>
      
      <!-- Object legalitas -->
      <text x="32" y="303"><tspan class="j-key">"legalitas"</tspan><tspan class="j-colon">: </tspan><tspan class="j-brace">{</tspan></text>
      <text x="48" y="323"><tspan class="j-key">"nomor_bpom"</tspan><tspan class="j-colon">: </tspan><tspan class="j-str">"BPOM TR213387651"</tspan><tspan class="j-brace">,</tspan></text>
      <text x="48" y="343"><tspan class="j-key">"standar_mutu"</tspan><tspan class="j-colon">: </tspan><tspan class="j-str">"CPOTB (Cara Pembuatan Obat Tradisional yang Baik)"</tspan><tspan class="j-brace">,</tspan></text>
      <text x="48" y="363"><tspan class="j-key">"sertifikasi_halal"</tspan><tspan class="j-colon">: </tspan><tspan class="j-str">"LPPOM MUI Halal Terdaftar"</tspan></text>
      <text x="32" y="383" class="j-brace">},</text>

      <!-- Object kategori -->
      <text x="32" y="403"><tspan class="j-key">"kategori"</tspan><tspan class="j-colon">: </tspan><tspan class="j-brace">{</tspan></text>
      <text x="48" y="423"><tspan class="j-key">"id_kategori"</tspan><tspan class="j-colon">: </tspan><tspan class="j-num">1</tspan><tspan class="j-brace">,</tspan></text>
      <text x="48" y="443"><tspan class="j-key">"nama_kategori"</tspan><tspan class="j-colon">: </tspan><tspan class="j-str">"Kapsul Ekstrak &amp; Fitofarmaka"</tspan><tspan class="j-brace">,</tspan></text>
      <text x="48" y="463"><tspan class="j-key">"slug"</tspan><tspan class="j-colon">: </tspan><tspan class="j-str">"kapsul-ekstrak-fitofarmaka"</tspan></text>
      <text x="32" y="483" class="j-brace">},</text>

      <!-- Object toko -->
      <text x="32" y="503"><tspan class="j-key">"toko"</tspan><tspan class="j-colon">: </tspan><tspan class="j-brace">{</tspan></text>
      <text x="48" y="523"><tspan class="j-key">"id_toko"</tspan><tspan class="j-colon">: </tspan><tspan class="j-num">1</tspan><tspan class="j-brace">,</tspan></text>
      <text x="48" y="543"><tspan class="j-key">"nama_toko"</tspan><tspan class="j-colon">: </tspan><tspan class="j-str">"PT Herbal Sejati Official Store"</tspan><tspan class="j-brace">,</tspan></text>
      <text x="48" y="563"><tspan class="j-key">"kota"</tspan><tspan class="j-colon">: </tspan><tspan class="j-str">"Jakarta Selatan"</tspan><tspan class="j-brace">, </tspan><tspan class="j-key">"kontak_wa"</tspan><tspan class="j-colon">: </tspan><tspan class="j-str">"081122334455"</tspan></text>
      <text x="32" y="583" class="j-brace">},</text>

      <!-- Timestamps -->
      <text x="32" y="603"><tspan class="j-key">"created_at"</tspan><tspan class="j-colon">: </tspan><tspan class="j-str">"2026-11-07 10:00:00"</tspan><tspan class="j-brace">, </tspan><tspan class="j-key">"updated_at"</tspan><tspan class="j-colon">: </tspan><tspan class="j-str">"2026-11-07 10:00:00"</tspan></text>
      <text x="16" y="623" class="j-brace">},</text>
      
      <!-- Timestamp Respon -->
      <text x="16" y="643"><tspan class="j-key">"timestamp"</tspan><tspan class="j-colon">: </tspan><tspan class="j-str">"2026-11-08T06:30:00+07:00"</tspan></text>
      <text x="0" y="663" class="j-brace">}</text>
    </g>

    <!-- Separator -->
    <line x1="680" y1="80" x2="680" y2="730" stroke="#e2e8f0" stroke-width="1.2" />

    <!-- Right Explanation Panel -->
    <g transform="translate(695, 95)">
      <text x="0" y="12" font-family="'Segoe UI', Arial, sans-serif" font-size="12.5px" font-weight="bold" fill="#0f172a">
        🔍 Struktur Objek Tunggal
      </text>
      <text x="0" y="27" font-family="'Segoe UI', Arial, sans-serif" font-size="9px" fill="#64748b">
        Rincian lengkap 1 sediaan spesifik
      </text>

      <g transform="translate(0, 42)">
        <rect x="0" y="0" width="295" height="110" class="panel-card" />
        <rect x="0" y="0" width="4" height="110" fill="#2563eb" rx="2" />
        <text x="14" y="20" class="panel-header" fill="#1e40af">1. Parameter &amp; Penanganan Error</text>
        <text x="14" y="38" class="panel-text">&bull; Endpoint dipanggil via query: <tspan class="panel-tag">?id=1</tspan>.</text>
        <text x="14" y="55" class="panel-text">&bull; Jika ID ditemukan: status <tspan font-weight="bold" fill="#059669">200 OK</tspan>.</text>
        <text x="14" y="72" class="panel-text">&bull; Jika ID tidak ada: status <tspan font-weight="bold" fill="#dc2626">404 Not Found</tspan>.</text>
        <text x="14" y="89" class="panel-text">&bull; Jika ID bukan angka: status <tspan font-weight="bold" fill="#b45309">400 Bad Request</tspan>.</text>
      </g>

      <g transform="translate(0, 165)">
        <rect x="0" y="0" width="295" height="125" class="panel-card" />
        <rect x="0" y="0" width="4" height="125" fill="#059669" rx="2" />
        <text x="14" y="20" class="panel-header" fill="#065f46">2. Kepatuhan Medis &amp; BPOM RI</text>
        <text x="14" y="38" class="panel-text">&bull; Objek <tspan class="panel-tag">legalitas</tspan> menyajikan nomor BPOM TR.</text>
        <text x="14" y="55" class="panel-text">&bull; Standar mutu CPOTB bebas kontaminasi.</text>
        <text x="14" y="72" class="panel-text">&bull; Sertifikasi Halal resmi terdaftar MUI.</text>
        <text x="14" y="89" class="panel-text">&bull; Memudahkan verifikasi resep dokter/apotek</text>
        <text x="14" y="103" class="panel-text">  secara terintegrasi melalui API.</text>
      </g>

      <g transform="translate(0, 303)">
        <rect x="0" y="0" width="295" height="100" class="panel-card" />
        <rect x="0" y="0" width="4" height="100" fill="#7e22ce" rx="2" />
        <text x="14" y="20" class="panel-header" fill="#6b21a8">3. Relasi Toko &amp; Kategori</text>
        <text x="14" y="38" class="panel-text">&bull; Menampilkan nama distributor resmi toko.</text>
        <text x="14" y="55" class="panel-text">&bull; Kontak WhatsApp apoteker untuk konsultasi.</text>
        <text x="14" y="72" class="panel-text">&bull; Slug kategori untuk deep-linking aplikasi mobile.</text>
      </g>

      <g transform="translate(0, 416)">
        <rect x="0" y="0" width="295" height="195" rx="8" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1" />
        <text x="14" y="22" font-family="'Segoe UI', Arial, sans-serif" font-size="11px" font-weight="bold" fill="#1d4ed8">
          🎨 Siap Edit di Figma
        </text>
        <text x="14" y="42" class="panel-text" fill="#1e3a8a">
          Dapat langsung di-<tspan font-style="italic">drag &amp; drop</tspan> ke kanvas Figma tanpa plugin.
        </text>
        <text x="14" y="75" class="panel-text" fill="#1e3a8a">
          &bull; Teks JSON otomatis menjadi editable layer.
        </text>
        <text x="14" y="94" class="panel-text" fill="#1e3a8a">
          &bull; Sangat cocok untuk lampiran dokumen tugas.
        </text>
        <text x="14" y="113" class="panel-text" fill="#1e3a8a">
          &bull; Memenuhi Soal 12 Poin c &amp; Poin h.
        </text>
        <rect x="14" y="145" width="267" height="28" rx="6" fill="#1d4ed8" />
        <text x="147" y="163" font-family="'Segoe UI', Arial, sans-serif" font-size="10px" font-weight="bold" fill="#ffffff" text-anchor="middle">
          ✓ Vector Fidelity 100% Native
        </text>
      </g>
    </g>

  </g>
</svg>

